name: Sync docs from apache/incubator-gluten

on:
  schedule:
    # Daily sync of main-branch docs into _docs/latest.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref of apache/incubator-gluten to sync docs from (e.g. main, v1.6.0)'
        required: false
        default: 'main'
      version:
        description: 'Target folder under _docs (use "latest" for main, or e.g. "v1.6.0" for a release archive)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.repository == 'apache/gluten-site'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gluten-site
        uses: actions/checkout@v4

      - name: Checkout gluten docs
        uses: actions/checkout@v4
        with:
          repository: apache/incubator-gluten
          ref: ${{ inputs.source_ref || 'main' }}
          path: gluten-src
          sparse-checkout: docs

      - name: Transform docs
        env:
          VERSION: ${{ inputs.version || 'latest' }}
        run: |
          echo "GLUTEN_SHA=$(git -C gluten-src rev-parse --short HEAD)" >> "$GITHUB_ENV"
          python3 scripts/sync_docs.py \
            --source gluten-src/docs \
            --dest "_docs/${VERSION}" \
            --version "${VERSION}"
          rm -rf gluten-src

      - name: Commit and push
        env:
          VERSION: ${{ inputs.version || 'latest' }}
        run: |
          git add -A _docs
          if git diff --cached --quiet; then
            echo "Docs are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync ${VERSION} docs from apache/incubator-gluten@${GLUTEN_SHA}"
          git push
