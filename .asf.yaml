github:
  description: "Apache Gluten is a middle layer responsible for offloading JVM-based SQL engines' execution to native engines."
  homepage: https://gluten.apache.org/
  features:
    issues: true
    projects: false
    wiki: false
  ghp_branch: main
  ghp_path: /
  labels:
    - sql
    - spark
    - gluten
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: false

  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
staging:
  profile:
  whoami: asf-staging

jekyll:
  whoami: main
  target: asf-site    # output branches need to be asf-site OR asf-staging*
# outputdir: outputdir          # MAY be needed, but generally can be left out

publish:
  whoami: asf-site


notifications:
  commits: commits@gluten.apache.org
  issues: commits@gluten.apache.org
  pullrequests: commits@gluten.apache.org
  jobs: commits@gluten.apache.org
  discussions: dev@gluten.apache.org
