---
layout: site-page
title: Blog
nav_order: 5
permalink: /blog/
---

<ul class="blog-list">
  {% for post in site.posts %}
    <li>
      <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
      <p class="post-meta">{{ post.date | date: "%B %-d, %Y" }}{% if post.author %} · {{ post.author }}{% endif %}</p>
      {{ post.excerpt }}
    </li>
  {% endfor %}
</ul>
